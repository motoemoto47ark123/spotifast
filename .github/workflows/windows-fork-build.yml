name: Windows fork build

# A Windows x64 download of this branch for testing, built the way the
# release workflow builds it, without a tag or the release signing keys.
# The zip and installer are attached to the run as an artifact.

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Ninja
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: rustup target add x86_64-pc-windows-msvc
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify standalone Windows runtime
        shell: pwsh
        run: |
          $binary = "target\x86_64-pc-windows-msvc\release\spotifast.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotifast imports an MSVC runtime:`n$runtime" }
          $version = (& $binary --version | Out-String).Trim()
          if ($version -notmatch '^spotifast \d+\.\d+\.\d+') { throw "Unexpected --version output: $version" }

      - name: Package
        shell: bash
        run: |
          name="spotifast-loginfix-x86_64-pc-windows-msvc"
          mkdir -p "dist/$name"
          cp target/x86_64-pc-windows-msvc/release/spotifast.exe "dist/$name/"
          cp README.md LICENSE packaging/spotifast-portable.txt "dist/$name/"
          cd dist
          7z a "$name.zip" "$name"

      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DArch=x86_64" `
            "/DBinary=$PWD\target\x86_64-pc-windows-msvc\release\spotifast.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\spotifast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: spotifast-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
